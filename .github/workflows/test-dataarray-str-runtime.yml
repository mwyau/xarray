name: Test DataArray.str docs-only fix

on:
  push:
    branches:
      - investigate/dataarray-str-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347

      - name: Create environments
        run: |
          pixi lock --no-install
          pixi install -e doc
          pixi install -e test-py314-with-typing

      - name: Verify runtime is unchanged
        run: |
          pixi run -e doc -- python - <<'PY'
          import typing
          import xarray as xr
          from xarray.core.accessor_str import StringAccessor

          origin = typing.get_origin(xr.DataArray.str)
          assert origin is StringAccessor
          assert xr.DataArray.str is not StringAccessor
          assert isinstance(xr.DataArray(["a"]).str, StringAccessor)
          print("DataArray.str runtime object:", xr.DataArray.str)
          print("origin:", origin)
          PY

      - name: Install type stubs
        run: |
          pixi run -e test-py314-with-typing -- python -m mypy --install-types --non-interactive xarray/ || true

      - name: Verify stubtest baseline
        run: |
          pixi run -e test-py314-with-typing -- python -m mypy.stubtest \
            xarray.core.dataarray \
            xarray.core.dataset \
            xarray.core.variable \
            --mypy-config-file pyproject.toml \
            --allowlist _stubtest/allowlist.txt

      - name: Build only DataArray.str docs with docs-only hook
        run: |
          mkdir -p /tmp/xarray-accessor-doc
          cat > /tmp/xarray-accessor-doc/conf.py <<'PY'
          import inspect
          import typing

          extensions = [
              "sphinx.ext.autodoc",
              "sphinx.ext.autosummary",
              "sphinx_autosummary_accessors",
          ]

          def unwrap_accessor_docstring(app, what, name, obj, options, lines):
              origin = typing.get_origin(obj)
              if what == "accessor" and origin is not None:
                  doc = inspect.getdoc(origin)
                  if doc is not None:
                      lines[:] = doc.splitlines()

          def setup(app):
              app.connect("autodoc-process-docstring", unwrap_accessor_docstring)
          PY
          cat > /tmp/xarray-accessor-doc/index.rst <<'RST'
          String accessor
          ===============

          .. currentmodule:: xarray

          .. autoaccessor:: DataArray.str
          RST
          pixi run -e doc -- sphinx-build \
            -T -W --keep-going \
            -b html \
            /tmp/xarray-accessor-doc \
            /tmp/xarray-accessor-doc/_build

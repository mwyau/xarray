name: Narrow string accessor docs

on:
  push:
    branches:
      - investigate/dataarray-str-docs

permissions:
  contents: read

jobs:
  docs-accessor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Create docs environment
        run: |
          pixi lock --no-install
          pixi install -e doc

      - name: Apply candidate accessor docstring markup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("xarray/core/accessor_str.py")
          text = path.read_text()
          start = text.index('    r"""Vectorized string functions for string-like arrays.', text.index("class StringAccessor"))
          end_marker = '    """\n\n    __slots__ = ("_obj",)'
          end = text.index(end_marker, start)
          replacement = r'''    r"""Vectorized string functions for string-like arrays.

    Similar to pandas, fields can be accessed through the `.str` attribute
    for applicable DataArrays.

    .. code-block:: pycon

        >>> da = xr.DataArray(["some", "text", "in", "an", "array"])
        >>> da.str.len()
        <xarray.DataArray (dim_0: 5)> Size: 40B
        array([4, 4, 2, 2, 5])
        Dimensions without coordinates: dim_0

    It also implements ``+``, ``*``, and ``%``, which operate as elementwise
    versions of the corresponding ``str`` methods. These will automatically
    broadcast for array-like inputs.

    .. code-block:: pycon

        >>> da1 = xr.DataArray(["first", "second", "third"], dims=["X"])
        >>> da2 = xr.DataArray([1, 2, 3], dims=["Y"])
        >>> da1.str + da2
        <xarray.DataArray (X: 3, Y: 3)> Size: 252B
        array([['first1', 'first2', 'first3'],
               ['second1', 'second2', 'second3'],
               ['third1', 'third2', 'third3']], dtype='<U7')
        Dimensions without coordinates: X, Y

        >>> da1 = xr.DataArray(["a", "b", "c", "d"], dims=["X"])
        >>> reps = xr.DataArray([3, 4], dims=["Y"])
        >>> da1.str * reps
        <xarray.DataArray (X: 4, Y: 2)> Size: 128B
        array([['aaa', 'aaaa'],
               ['bbb', 'bbbb'],
               ['ccc', 'cccc'],
               ['ddd', 'dddd']], dtype='<U4')
        Dimensions without coordinates: X, Y

        >>> da1 = xr.DataArray(["%s_%s", "%s-%s", "%s|%s"], dims=["X"])
        >>> da2 = xr.DataArray([1, 2], dims=["Y"])
        >>> da3 = xr.DataArray([0.1, 0.2], dims=["Z"])
        >>> da1.str % (da2, da3)
        <xarray.DataArray (X: 3, Y: 2, Z: 2)> Size: 240B
        array([[['1_0.1', '1_0.2'],
                ['2_0.1', '2_0.2']],
        <BLANKLINE>
               [['1-0.1', '1-0.2'],
                ['2-0.1', '2-0.2']],
        <BLANKLINE>
               [['1|0.1', '1|0.2'],
                ['2|0.1', '2|0.2']]], dtype='<U5')
        Dimensions without coordinates: X, Y, Z

    .. note::
        When using ``%`` formatting with a dict, the values are always used as a
        single value, they are not applied elementwise.

        .. code-block:: pycon

            >>> da1 = xr.DataArray(["%(a)s"], dims=["X"])
            >>> da2 = xr.DataArray([1, 2, 3], dims=["Y"])
            >>> da1 % {"a": da2}
            <xarray.DataArray (X: 1)> Size: 8B
            array(['<xarray.DataArray (Y: 3)> Size: 24B\narray([1, 2, 3])\nDimensions without coordinates: Y'],
                  dtype=object)
            Dimensions without coordinates: X
    """'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Build only DataArray.str accessor docs
        run: |
          mkdir -p /tmp/xarray-accessor-doc
          cat > /tmp/xarray-accessor-doc/conf.py <<'PY'
          extensions = [
              "sphinx.ext.autodoc",
              "sphinx.ext.autosummary",
              "sphinx_autosummary_accessors",
          ]
          PY
          cat > /tmp/xarray-accessor-doc/index.rst <<'RST'
          String accessor
          ===============

          .. currentmodule:: xarray

          .. autoaccessor:: DataArray.str
          RST
          pixi run -e doc -- sphinx-build \
            -T -W --keep-going \
            -b html \
            /tmp/xarray-accessor-doc \
            /tmp/xarray-accessor-doc/_build

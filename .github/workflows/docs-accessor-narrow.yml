name: Narrow string accessor docs

on:
  push:
    branches:
      - investigate/dataarray-str-docs

permissions:
  contents: read

jobs:
  docs-accessor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1

      - name: Create docs environment
        run: |
          pixi lock --no-install
          pixi install -e doc

      - name: Inspect normalized StringAccessor docstring
        run: |
          pixi run -e doc -- python - <<'PY'
          from sphinx.util.docstrings import prepare_docstring
          from xarray.core.accessor_str import StringAccessor

          for number, line in enumerate(prepare_docstring(StringAccessor.__doc__), 1):
              print(f"{number:03d}: {line!r}")
          PY

      - name: Build only DataArray.str accessor docs
        run: |
          mkdir -p /tmp/xarray-accessor-doc
          cat > /tmp/xarray-accessor-doc/conf.py <<'PY'
          extensions = [
              "sphinx.ext.autodoc",
              "sphinx.ext.autosummary",
              "sphinx_autosummary_accessors",
          ]
          PY
          cat > /tmp/xarray-accessor-doc/index.rst <<'RST'
          String accessor
          ===============

          .. currentmodule:: xarray

          .. autoaccessor:: DataArray.str
          RST
          pixi run -e doc -- sphinx-build \
            -T -W --keep-going \
            -b html \
            /tmp/xarray-accessor-doc \
            /tmp/xarray-accessor-doc/_build
